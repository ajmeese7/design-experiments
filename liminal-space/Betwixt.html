<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Betwixt — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f4f1ea; height: 100%; }
  #root { height: 100vh; width: 100vw; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#f4f1ea">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f4f1ea"/>
    <line x1="200" y1="300" x2="1000" y2="300" stroke="#1a1714" stroke-width="2"/>
    <line x1="200" y1="500" x2="1000" y2="500" stroke="#1a1714" stroke-width="2"/>
    <text x="600" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-style="italic" fill="#1a1714">betwixt</text>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel">
// BETWIXT — editorial, with article reading view
// Two sub-views: (A) Contents (TOC) and (B) Reading — drop-cap essay layout

function BetwixtDirection() {
  const [view, setView] = React.useState('toc'); // toc | read
  const [hover, setHover] = React.useState(null);

  const essays = [
    { n: '01', t: 'On the week between Christmas and New Year', a: 'No one knows what day it is. Time becomes soft.', r: '7 min' },
    { n: '02', t: 'After the diagnosis, before the treatment', a: 'You are the same person. You are not the same person.', r: '12 min' },
    { n: '03', t: 'The apartment, emptied', a: 'The walls you painted are someone else\'s now.', r: '5 min' },
    { n: '04', t: 'Between languages', a: 'The word existed in one mouth. It does not exist in the other.', r: '9 min' },
    { n: '05', t: 'The six months after she died', a: '', r: '18 min' },
  ];

  return (
    <div style={{
      width: '100%', height: '100%', background: '#f4f1ea', color: '#1a1714',
      fontFamily: '"EB Garamond", "Cormorant Garamond", Georgia, serif',
      overflow: 'auto', position: 'relative', display: 'flex', flexDirection: 'column',
    }}>
      <div style={{ padding: '24px 36px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
        borderBottom: '1px solid rgba(0,0,0,0.12)', paddingBottom: 16,
      }}>
        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 0.25, textTransform: 'uppercase', opacity: 0.55 }}>
          Betwixt · Issue N° 04
        </div>
        <div style={{ display: 'flex', gap: 2 }}>
          {['toc','read'].map((v) => (
            <button key={v} onClick={() => setView(v)} style={{
              background: view === v ? '#1a1714' : 'transparent',
              color: view === v ? '#f4f1ea' : '#1a1714',
              border: '1px solid #1a1714', padding: '3px 9px', fontSize: 9,
              letterSpacing: 0.2, textTransform: 'uppercase',
              cursor: 'pointer', fontFamily: 'ui-monospace, monospace',
            }}>{v === 'toc' ? 'Contents' : 'Reading'}</button>
          ))}
        </div>
      </div>

      {view === 'toc' && <TOCView essays={essays} hover={hover} setHover={setHover} onOpen={() => setView('read')} />}
      {view === 'read' && <ReadView onBack={() => setView('toc')} />}
    </div>
  );
}

function TOCView({ essays, hover, setHover, onOpen }) {
  return (
    <div>
      <div style={{ padding: '56px 36px 70px', maxWidth: 580 }}>
        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 0.25,
          textTransform: 'uppercase', opacity: 0.5, marginBottom: 16 }}>from the editor</div>
        <p style={{ fontSize: 22, lineHeight: 1.4, fontWeight: 400, margin: 0, letterSpacing: -0.1, textWrap: 'pretty' }}>
          There are rooms in a life that have no name. The months after someone dies.
          The afternoon you realize you have outgrown your city.
          <em style={{ color: '#8a6a3a' }}> We publish from inside these rooms.</em>
        </p>
        <div style={{ marginTop: 28, fontSize: 12, fontStyle: 'italic', opacity: 0.6 }}>— m.l., editor</div>
      </div>

      <div style={{ padding: '0 36px 48px' }}>
        <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 0.25, textTransform: 'uppercase',
          opacity: 0.5, marginBottom: 18, display: 'flex', justifyContent: 'space-between' }}>
          <span>Contents</span><span>5 pieces</span>
        </div>
        {essays.map((e) => (
          <article key={e.n}
            onMouseEnter={() => setHover(e.n)}
            onMouseLeave={() => setHover(null)}
            onClick={onOpen}
            style={{ borderTop: '1px solid rgba(0,0,0,0.12)', padding: '18px 0',
              display: 'grid', gridTemplateColumns: '40px 1fr 70px', gap: 20,
              alignItems: 'baseline', cursor: 'pointer', transition: 'padding-left 0.2s',
              paddingLeft: hover === e.n ? 10 : 0,
            }}>
            <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, fontVariantNumeric: 'tabular-nums', opacity: 0.5 }}>{e.n}</div>
            <div>
              <h3 style={{ fontSize: 18, margin: 0, fontWeight: 400, lineHeight: 1.25, letterSpacing: -0.05,
                color: hover === e.n ? '#8a6a3a' : 'inherit', transition: 'color 0.2s' }}>{e.t}</h3>
              {e.a && <p style={{ fontSize: 12, fontStyle: 'italic', opacity: 0.65, margin: '5px 0 0', lineHeight: 1.4 }}>{e.a}</p>}
            </div>
            <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, opacity: 0.5, textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{e.r}</div>
          </article>
        ))}
        <div style={{ borderTop: '1px solid rgba(0,0,0,0.12)' }} />
      </div>
    </div>
  );
}

function ReadView({ onBack }) {
  return (
    <div style={{ padding: '32px 40px 60px', maxWidth: 620, margin: '0 auto', position: 'relative' }}>
      <button onClick={onBack} style={{
        background: 'transparent', border: 'none', cursor: 'pointer',
        fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 0.2,
        textTransform: 'uppercase', color: '#8a6a3a', padding: 0, marginBottom: 24,
      }}>← contents</button>

      <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 0.25,
        textTransform: 'uppercase', opacity: 0.55, marginBottom: 8 }}>
        N° 04 · Essay 03 · 5 min
      </div>

      <h1 style={{ fontSize: 40, lineHeight: 1.1, fontWeight: 400, margin: '0 0 8px', letterSpacing: -0.4, textWrap: 'balance' }}>
        The apartment, emptied
      </h1>
      <div style={{ fontSize: 14, fontStyle: 'italic', opacity: 0.65, marginBottom: 34 }}>
        by Asha Rahimi · April 2026
      </div>

      <p style={{ fontSize: 16, lineHeight: 1.65, margin: '0 0 18px', textWrap: 'pretty' }}>
        <span style={{ float: 'left', fontSize: 62, lineHeight: 0.85, paddingRight: 8, paddingTop: 4, fontWeight: 500, color: '#8a6a3a' }}>T</span>
        he apartment is a room now, not a home. I have spent four hours sweeping it and
        cannot tell if the floors are cleaner or if my eyes have adjusted. The movers
        will come on Tuesday. Between now and then I have to decide what a life is.
      </p>
      <p style={{ fontSize: 16, lineHeight: 1.65, margin: '0 0 18px' }}>
        There is a nail in the wall where a photograph used to be. I took the photograph
        down yesterday. The nail is still there, and the small crescent of paint the frame
        protected for five years is brighter than the rest.
      </p>
      <p style={{ fontSize: 16, lineHeight: 1.65, margin: '0 0 18px', fontStyle: 'italic', color: '#4a3f2e',
        borderLeft: '2px solid #8a6a3a', paddingLeft: 18, marginLeft: -18 }}>
        This is the part no one tells you about moving: there is always a week where you
        live somewhere that is not yours anymore but is also not yet anyone else's.
      </p>
      <p style={{ fontSize: 16, lineHeight: 1.65, margin: '0 0 18px' }}>
        I sleep on a mattress on the floor. I eat standing up, from paper plates.
        Friends keep asking if I am okay, and I am — but the question assumes a stable
        subject, and I am not sure one exists right now. The walls I painted are
        someone else's walls. The kitchen I chose is a kitchen for someone I won't meet.
      </p>

      <div style={{ marginTop: 42, padding: '20px 0', borderTop: '1px solid rgba(0,0,0,0.12)',
        borderBottom: '1px solid rgba(0,0,0,0.12)', display: 'flex', justifyContent: 'space-between',
        fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 0.15, textTransform: 'uppercase',
      }}>
        <span style={{ opacity: 0.55 }}>← Essay 02 · After the diagnosis</span>
        <span style={{ opacity: 0.55 }}>Essay 04 · Between languages →</span>
      </div>

      <div style={{ marginTop: 40, fontSize: 11, opacity: 0.5, fontStyle: 'italic', textAlign: 'center',
        fontFamily: 'ui-monospace, monospace', letterSpacing: 0.15 }}>
        · · ·
      </div>
    </div>
  );
}

window.BetwixtDirection = BetwixtDirection;

</script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<BetwixtDirection />);
</script>
</body>
</html>
